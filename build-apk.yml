name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        default: MB Editor
      app_id:
        description: Package ID
        required: true
        default: com.multibundle.editor
      version:
        description: Version
        required: true
        default: 1.0.0
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      VERSION: ${{ inputs.version }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fixed signing key (needed for Google sign-in)
        run: |
          # GitHub gives every run a brand new debug key, so Google would never recognise the app.
          # The first run creates debug.keystore and saves it in the repo; every later run reuses it.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add fixed debug keystore"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not save debug.keystore to the repo. Add it yourself so the key stays the same."
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          {
            echo "### Add these to Firebase (Project settings > Your apps > Android > Add fingerprint)"
            echo '```'
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256"
            echo '```'
            echo "Package name: \`$APP_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare web files
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm install
            npm run build
            if [ -d dist ]; then cp -r dist/. "$RUNNER_TEMP/www/"; else cp -r build/. "$RUNNER_TEMP/www/"; fi
          else
            tar --exclude=.git --exclude=.github --exclude=debug.keystore --exclude=google-services.json -cf - . | tar -xf - -C "$RUNNER_TEMP/www"
          fi
      - name: Create Android project
        run: |
          mkdir "$RUNNER_TEMP/cap"
          cd "$RUNNER_TEMP/cap"
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          NATIVE_GOOGLE=0
          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            npm install @capacitor-firebase/authentication@8 --legacy-peer-deps
            NATIVE_GOOGLE=1
          else
            echo "::notice::No google-services.json in the repo, so the app is built WITHOUT native Google sign-in."
          fi
          export NATIVE_GOOGLE
          mv "$RUNNER_TEMP/www" www
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          rm -f capacitor.config.ts
          node -e "
            const fs = require('fs');
            const cfg = { appId: process.env.APP_ID, appName: process.env.APP_NAME, webDir: 'www', server: { androidScheme: 'https' } };
            if (process.env.NATIVE_GOOGLE === '1') cfg.plugins = { FirebaseAuthentication: { skipNativeAuth: true, providers: ['google.com'] } };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          npx cap add android
          if [ "$NATIVE_GOOGLE" = "1" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" android/app/google-services.json
          fi
          if [ -f "$GITHUB_WORKSPACE/FolderAccessPlugin.java" ]; then
            PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
            mkdir -p "$PKG_DIR"
            sed "s/^package .*/package $APP_ID;/" "$GITHUB_WORKSPACE/FolderAccessPlugin.java" > "$PKG_DIR/FolderAccessPlugin.java"
            sed "s/^package .*/package $APP_ID;/" "$GITHUB_WORKSPACE/MainActivity.java" > "$PKG_DIR/MainActivity.java"
          fi
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow
          python3 "$GITHUB_WORKSPACE/mbicons.py" android/app/src/main/res "$GITHUB_WORKSPACE/logo.png"
          npx cap sync android
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/cap/android"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SAFE=$(printf "%s" "$APP_NAME" | tr -c "A-Za-z0-9._-" "-" | sed "s/--*/-/g; s/^-//; s/-$//"); [ -n "$SAFE" ] || SAFE=app
          cp "$RUNNER_TEMP/cap/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/$SAFE.apk"
          gh release create "apk-${{ github.run_number }}" "$RUNNER_TEMP/$SAFE.apk" --title "APK build ${{ github.run_number }}" --notes "$APP_NAME $VERSION" --target "$GITHUB_SHA"
