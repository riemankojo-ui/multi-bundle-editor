name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        default: MB Editor
      app_id:
        description: Package ID
        required: true
        default: com.multibundle.editor
      version:
        description: Version
        required: true
        default: 1.0.0
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      VERSION: ${{ inputs.version }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          if [ -f www/index.html ]; then
            cp -r www/. "$RUNNER_TEMP/www/"
          elif [ -f package.json ] && grep -q '"build"' package.json; then
            npm install
            npm run build
            if [ -d dist ]; then cp -r dist/. "$RUNNER_TEMP/www/"; else cp -r build/. "$RUNNER_TEMP/www/"; fi
          else
            tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C "$RUNNER_TEMP/www"
          fi
      - name: Create Android project
        run: |
          mkdir "$RUNNER_TEMP/cap"
          cd "$RUNNER_TEMP/cap"
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          mv "$RUNNER_TEMP/www" www
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          if [ -d "$GITHUB_WORKSPACE/native" ]; then
            cp -r "$GITHUB_WORKSPACE/native" native
            sed -i "s/^package .*;/package $APP_ID;/" native/*.java
            sed -i "s|com/rieman/softplayer|$(echo "$APP_ID" | tr . /)|" native/patch.py
            python3 native/patch.py
            if [ -f native/icon.py ]; then python3 native/icon.py; fi
            sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://jitpack.io' }|g" android/build.gradle
            npm install @capacitor/app@8
          fi
          if [ -f "$GITHUB_WORKSPACE/FolderAccessPlugin.java" ]; then
            PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
            mkdir -p "$PKG_DIR"
            sed "s/^package .*/package $APP_ID;/" "$GITHUB_WORKSPACE/FolderAccessPlugin.java" > "$PKG_DIR/FolderAccessPlugin.java"
            sed "s/^package .*/package $APP_ID;/" "$GITHUB_WORKSPACE/MainActivity.java" > "$PKG_DIR/MainActivity.java"
          fi
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow
          python3 "$GITHUB_WORKSPACE/mbicons.py" android/app/src/main/res "$GITHUB_WORKSPACE/logo.png"
          npx cap sync android
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/cap/android"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SAFE=$(printf "%s" "$APP_NAME" | tr -c "A-Za-z0-9._-" "-" | sed "s/--*/-/g; s/^-//; s/-$//"); [ -n "$SAFE" ] || SAFE=app
          cp "$RUNNER_TEMP/cap/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/$SAFE.apk"
          gh release create "apk-${{ github.run_number }}" "$RUNNER_TEMP/$SAFE.apk" --title "APK build ${{ github.run_number }}" --notes "$APP_NAME $VERSION" --target "$GITHUB_SHA"
